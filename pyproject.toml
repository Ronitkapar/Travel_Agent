[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripmate-ai"
version = "2.1.0"
description = "LangGraph + MCP multi-agent travel planner with supervisor, guardrails, and human-in-the-loop approval."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # Orchestration
    "langgraph==1.2.2",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.0",
    "mcp==1.28.1",
    "langgraph-checkpoint-postgres==3.1.0",
    # Persistence (optional at runtime: only used when DATABASE_URL is set)
    "psycopg[binary]==3.3.4",
    "psycopg_pool==3.3.1",
    # HTTP and TLS
    "requests==2.34.2",
    "certifi==2026.6.17",
    # Web layer
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "python-dotenv==1.2.2",
    # Observability (optional at runtime: no-op unless LOGFIRE_TOKEN is set)
    "logfire[fastapi,psycopg,httpx]==5.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/Ronitkapar/TravelAgent"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tripmate.mcp" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
